version: 2

project_name: caskvet

before:
  hooks:
    - go mod tidy

builds:
  - id: caskvet
    main: ./cmd/caskvet
    binary: caskvet
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - arm64
      - amd64
    ldflags:
      - -s -w
      - -X github.com/breichr/caskvet/internal/cli.version={{.Version}}
    hooks:
      # Sign every built binary with the maintainer's Developer ID.
      # Hardened runtime and a secure timestamp are required for
      # notarization (added when Apple credentials are provided).
      post:
        - cmd: >-
            codesign --sign "Developer ID Application: Christian Breiteneder (N8M53QK9TU)"
            --timestamp --options runtime {{ .Path }}
archives:
  - id: default
    formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Tag }}_darwin_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

release:
  draft: true
  mode: keep-existing

# The own Homebrew tap (homebrew-caskvet) is a later roadmap stage:
# its formula lives in the tap repository, not here.
